name: '[TEST] SBOM Generation'
on:
    pull_request:

jobs:
    test-sbom:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v4
            -   name: Set up Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '20.x'
            -   name: Install pnpm
                run: npm install -g pnpm
            -   name: Install dependencies
                run: pnpm install
            -   name: Read version
                id: read-version
                run: echo "VERSION=$(node -p "require('./packages/api/package.json').version")" >> $GITHUB_OUTPUT
            -   name: Create sbom output directory
                run: mkdir -p sbom
            -   name: Generate SBOM — api
                uses: anchore/sbom-action@v0
                with:
                    path: packages/api/
                    output-file: sbom/nl-portal-nl-portal-api-${{ steps.read-version.outputs.VERSION }}.cdx.json
                    artifact-name: nl-portal-nl-portal-api-${{ steps.read-version.outputs.VERSION }}.cdx.json
                    format: cyclonedx-json
                    upload-artifact: true
                    upload-artifact-retention: 90
                    upload-release-assets: false
                    dependency-snapshot: true
                    github-token: ${{ secrets.GITHUB_TOKEN }}
            -   name: Generate SBOM — authentication
                uses: anchore/sbom-action@v0
                with:
                    path: packages/authentication/
                    output-file: sbom/nl-portal-nl-portal-authentication-${{ steps.read-version.outputs.VERSION }}.cdx.json
                    artifact-name: nl-portal-nl-portal-authentication-${{ steps.read-version.outputs.VERSION }}.cdx.json
                    format: cyclonedx-json
                    upload-artifact: true
                    upload-artifact-retention: 90
                    upload-release-assets: false
                    dependency-snapshot: true
                    github-token: ${{ secrets.GITHUB_TOKEN }}
            -   name: Generate SBOM — localization
                uses: anchore/sbom-action@v0
                with:
                    path: packages/localization/
                    output-file: sbom/nl-portal-nl-portal-localization-${{ steps.read-version.outputs.VERSION }}.cdx.json
                    artifact-name: nl-portal-nl-portal-localization-${{ steps.read-version.outputs.VERSION }}.cdx.json
                    format: cyclonedx-json
                    upload-artifact: true
                    upload-artifact-retention: 90
                    upload-release-assets: false
                    dependency-snapshot: true
                    github-token: ${{ secrets.GITHUB_TOKEN }}
            -   name: Generate SBOM — user-interface
                uses: anchore/sbom-action@v0
                with:
                    path: packages/user-interface/
                    output-file: sbom/nl-portal-nl-portal-user-interface-${{ steps.read-version.outputs.VERSION }}.cdx.json
                    artifact-name: nl-portal-nl-portal-user-interface-${{ steps.read-version.outputs.VERSION }}.cdx.json
                    format: cyclonedx-json
                    upload-artifact: true
                    upload-artifact-retention: 90
                    upload-release-assets: false
                    dependency-snapshot: true
                    github-token: ${{ secrets.GITHUB_TOKEN }}
